{% extends 'base.html' %}{% block title %}Sign in · Member Portal{% endblock %}{% block content %}<section class="auth-card card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="muted">Access your secure member portal.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email|default('') }}" autocomplete="email" required><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="toggle-password" type="button" data-target="password" aria-label="Show password">Show</button></div><button class="primary" type="submit">Sign in</button></form><a class="secondary-link" href="{{ url_for('forgot_password') }}">Forgot your password?</a><p class="foot-note">New here? <a href="{{ url_for('signup') }}">Create an account</a></p></section>{% endblock %}
