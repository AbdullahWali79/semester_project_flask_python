<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Member Portal{% endblock %}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('index') }}">Member Portal</a>{% if session.get('user') %}<form method="post" action="{{ url_for('logout') }}" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link-button">Sign out</button></form>{% endif %}</header><main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% if content %}<section class="card"><p>{{ content }}</p></section>{% endif %}{% endblock %}</main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
