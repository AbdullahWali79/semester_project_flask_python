{% extends 'base.html' %}{% block title %}Create account · Member Portal{% endblock %}{% block content %}<section class="auth-card card"><div class="eyebrow">GET STARTED</div><h1>Create account</h1><p class="muted">A few details and you are ready to go.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" value="{{ full_name|default('') }}" maxlength="100" autocomplete="name" required><label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email|default('') }}" autocomplete="email" required><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="toggle-password" type="button" data-target="password" aria-label="Show password">Show</button></div><small>Use at least 8 characters.</small><label for="confirm_password">Confirm password</label><div class="password-wrap"><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button class="toggle-password" type="button" data-target="confirm_password" aria-label="Show password">Show</button></div><button class="primary" type="submit">Create account</button></form><p class="foot-note">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
